<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tsinjo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="mb-4">Tsinjo - Fonds d'urgence HEI</h1>

    <!-- Formulaire de don -->
    <div class="card mb-5">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Faire un don</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/donate}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="col-md-6">
                        <label for="fullName" class="form-label">Nom complet</label>
                        <input type="text" class="form-control" id="fullName" name="fullName" required>
                    </div>
                    <div class="col-md-4">
                        <label for="amount" class="form-label">Montant (Ar)</label>
                        <input type="number" class="form-control" id="amount" name="amount" min="1000" step="100" required>
                    </div>
                    <div class="col-md-4">
                        <label for="paymentMethod" class="form-label">Méthode de paiement</label>
                        <select class="form-select" id="paymentMethod" name="paymentMethod" required>
                            <option value="">Choisir...</option>
                            <option th:each="method : ${paymentMethods}"
                                    th:value="${method}"
                                    th:text="${method}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Soumettre le don</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Historique des transactions -->
    <div class="row">
        <!-- Dons -->
        <div class="col-md-6">
            <h3 class="mb-3">Dons récents</h3>
            <div class="list-group">
                <div th:each="donation : ${donations}" class="list-group-item mb-2">
                    <div class="d-flex w-100 justify-content-between">
                        <h6 class="mb-1" th:text="${donation.donor.fullName} + ' (' + ${donation.donor.email} + ')'"></h6>
                        <small th:text="${#temporals.format(donation.payment.payementDate, 'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                    <p class="mb-1">
                        <span th:text="${#numbers.formatCurrency(donation.payment.amount)}"></span>
                        via <span th:text="${donation.payment.paymentMethodes}"></span>
                    </p>
                    <small th:class="${donation.payment.paymentStatus == 'SUCCEEDED' ? 'text-success' :
                                      donation.payment.paymentStatus == 'FAILED' ? 'text-danger' : 'text-warning'}"
                           th:text="${donation.payment.paymentStatus}"></small>
                </div>
            </div>
        </div>

        <!-- Aides -->
        <div class="col-md-6">
            <h3 class="mb-3">Aides récentes</h3>
            <div class="list-group">
                <div th:each="help : ${helps}" class="list-group-item mb-2">
                    <div class="d-flex w-100 justify-content-between">
                        <h6 class="mb-1" th:text="${help.beneficiary.fullName} + ' (' + ${help.beneficiary.email} + ')'"></h6>
                        <small th:text="${#temporals.format(help.payment.payementDate, 'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                    <p class="mb-1" th:text="${help.accidentDescription}"></p>
                    <p class="mb-1">
                        <span th:text="${#numbers.formatCurrency(help.payment.amount)}"></span>
                        via <span th:text="${help.payment.paymentMethodes}"></span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
